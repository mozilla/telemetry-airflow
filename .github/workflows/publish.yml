name: Publish

on:
  push:
    branches:
      - main

# Never cancel an in-flight publish: ArgoCD and the DAGs repo both consume its output.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  # ArgoCD tracks the `main-<short sha>` tag in this repository, see
  # dataservices-infra/telemetry-airflow/k8s/telemetry-airflow/.argocd-source-*.yaml
  IMAGE: us-docker.pkg.dev/moz-fx-telemetry-airflow-prod/telemetry-airflow-prod/telemetry-airflow

jobs:
  publish-image:
    name: Publish image to GAR
    runs-on: ubuntu-latest
    # The artifact-writer service account only trusts jobs in the `build` environment,
    # see modules/tenant_bootstrap in dataservices-infra. Which branches can use the
    # environment is set in the repository settings.
    environment: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate image tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            # TODO: revert after trial. CircleCI still owns the sha-, main- and latest
            # tags while both systems run, so only push a GHA-specific tag for now.
            echo "${IMAGE}:gha-test-${short_sha}"
            # echo "${IMAGE}:sha-${short_sha}"
            # echo "${IMAGE}:main-${short_sha}"
            # echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate build version.json
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '{"commit":"%s","version":"%s","source":"%s/%s","build":"%s"}\n' \
            "$GITHUB_SHA" "" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_URL" \
            > version.json
          cat version.json

      - name: Build the Docker image
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        # TODO: revert after trial. Restore the sha-, main- and latest tags.
        run: |
          docker build . \
            -t "${IMAGE}:gha-test-${SHORT_SHA}"

      - name: Push Docker image to GAR
        uses: mozilla-it/deploy-actions/docker-push@ef0f037316873ff408a598f1cd98876dd7851e53  # v6.7.0
        with:
          project_id: moz-fx-telemetry-airflow-prod
          image_tags: ${{ steps.meta.outputs.tags }}
          workload_identity_pool_project_number: ${{ vars.GCPV2_WORKLOAD_IDENTITY_POOL_PROJECT_NUMBER }}
          service_account_name: artifact-writer

  sync-dags-branch:
    name: Update DAGs branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout dags branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dags
          path: dags-branch
          # Needed to push back to the branch. Pushes made with GITHUB_TOKEN do not
          # trigger further workflow runs, which replaces the old `[skip ci]` marker.
          persist-credentials: true

      - name: Copy dags and push
        working-directory: dags-branch
        run: |
          rm -rf dags
          cp -r ../dags dags
          git config user.name "github-actions[bot]"
          git config user.email "dataops@mozilla.com"
          git add .
          if git diff --cached --quiet; then
            echo "Skipping commit since there were no changes"
          else
            git commit -m "Automatic commit - DAGs from commit ${GITHUB_SHA::7} build ${GITHUB_RUN_NUMBER}"
          fi
          # TODO: revert after trial. Use a plain `git push` inside the else branch above.
          # A dry run still authenticates, so it fails if the token cannot write to the branch.
          git push --dry-run

  sync-dags-repo:
    name: Synchronize telemetry-airflow-dags repository
    runs-on: ubuntu-latest
    environment: sync-dags-repo
    needs: sync-dags-branch
    permissions: {}
    steps:
      - name: Set up SSH deploy key for telemetry-airflow-dags
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_TELEMETRY_AIRFLOW_DAGS }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update DAGs submodule
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "dataops@mozilla.com"
          git clone --branch main git@github.com:mozilla/telemetry-airflow-dags.git
          cd telemetry-airflow-dags
          # The submodule is declared with an SSH URL; fetch it over HTTPS so the
          # deploy key above is only ever used for telemetry-airflow-dags itself.
          git config submodule.telemetry-airflow.url https://github.com/mozilla/telemetry-airflow.git
          git submodule update --init --depth 1 telemetry-airflow
          git -C telemetry-airflow pull origin dags
          git add telemetry-airflow
          git commit --allow-empty \
            -m "Automatic commit from telemetry-airflow commit ${GITHUB_SHA::7} build ${GITHUB_RUN_NUMBER}"
          # TODO: revert after trial. Remove --dry-run once CircleCI no longer pushes here.
          git push --dry-run origin main
