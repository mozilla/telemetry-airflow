name: CI

on:
  pull_request:

# Cancel superseded runs for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHON_VERSION: '3.11.8'

jobs:
  validate-requirements:
    name: Validate requirements
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev requirements
        run: pip install --no-deps -r requirements-dev.txt

      - name: Verify requirements.txt is sync'ed with requirements.in
        run: |
          pip-compile --quiet --strip-extras --no-annotate requirements.in
          pip-compile --quiet --strip-extras --no-annotate requirements-dev.in
          git diff --exit-code requirements.txt requirements-dev.txt

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev requirements
        run: pip install --no-deps -r requirements-dev.txt

      - name: Ruff linting
        run: ruff check --output-format=github .

      - name: Ruff formatting
        run: ruff format --check --diff .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-override.txt

      - name: Install requirements
        run: make pip-install-local

      - name: Pytest
        run: python -m pytest --junitxml=test-results/junit.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results
          path: test-results/junit.xml

  validate-local-environment:
    name: Validate local environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate build version.json
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '{"commit":"%s","version":"%s","source":"%s/%s","build":"%s"}\n' \
            "$GITHUB_SHA" "" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_URL" \
            > version.json
          cat version.json

      - name: Build the Docker image
        run: docker build . -t "telemetry-airflow:${GITHUB_SHA::7}"

      - name: Override docker-compose.yml with the built image
        run: |
          sed -i "s|  build: .|  image: telemetry-airflow:${GITHUB_SHA::7}|g" docker-compose.yml

      - name: Start up local environment
        run: |
          pip3 install cryptography -c constraints.txt
          make up
